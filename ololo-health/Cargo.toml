[package]
name = "ololo-health"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Code-health analysis shared by the ololo client and servers: jscpd in-process, one config, one score"

[dependencies]
# jscpd's Rust core, called in-process. Pinned exactly: the health formula
# has changed between patch releases, and the client and the server must
# score a tree identically — see `JSCPD_CORE_VERSION` in lib.rs, which a
# test keeps in step with these pins.
cpd-core = "=0.1.16"
cpd-finder = "=0.1.17"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "2.0"
# `analyze_async` only needs a oneshot channel and a timeout; the analysis
# itself runs on a plain std thread (jscpd's pipeline is synchronous).
tokio = { version = "1.38.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
