# Release pipeline for the PUBLIC repository (ololo-dev/ololo).
#
# Every push to main — normally a platform snapshot sync — rebuilds and
# publishes:
#   - the ololo CLI for five platforms, as a GitHub release. The release for
#     the current CLI version (ololo/Cargo.toml) is refreshed in place and
#     `releases/latest` always points at the newest build — the contract
#     https://ololo.dev/install.sh and install.ps1 depend on;
#   - the three container images to GHCR: ololo-server, ololo-game-server,
#     ololo-frontend, tagged :latest and :sha-<short>. docker-compose.yml
#     pulls these by default.
#
# This file also ships in the private development repo, where it must never
# run — hence the repository guard on the entry jobs.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    if: github.repository == 'ololo-dev/ololo'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      changes: ${{ steps.log.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "version=$(grep -m1 '^version' ololo/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect changes since the previous release
        id: log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous release body records the commit it was built from;
          # list commit subjects since then (snapshot syncs read as one line
          # per sync, which is the granularity the public history has).
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
                 | grep -oE 'ololo-dev/ololo@[0-9a-f]{40}' | head -1 | cut -d@ -f2 || true)
          if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then
            range="$prev..HEAD"
          else
            range="HEAD~5..HEAD"
          fi
          log=$(git log --no-merges --pretty='- %s (%h)' "$range" | head -40)
          [ -z "$log" ] && log="- Maintenance rebuild"
          {
            echo "changes<<CHANGES_EOF"
            echo "$log"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ololo-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ololo-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ololo-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ololo-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ololo-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p ololo --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.artifact }} ololo

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/ololo.exe -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [version, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # The images job uploads .dockerbuild record artifacts into the
          # same run; only the CLI archives belong on the release.
          pattern: "ololo-*"
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ololo v${{ needs.version.outputs.version }}
          body: |
            Automated build of the ololo CLI and the platform container images.

            ### Changes
            ${{ needs.version.outputs.changes }}

            ### Containers
            `ghcr.io/ololo-dev/ololo-server`, `ghcr.io/ololo-dev/ololo-game-server`,
            `ghcr.io/ololo-dev/ololo-frontend` — `:latest` plus a `sha-<commit>`
            tag per build.

            Source: ololo-dev/ololo@${{ needs.version.outputs.sha }}
          files: dist/*
          make_latest: true

  images:
    if: github.repository == 'ololo-dev/ololo'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: game-server
            dockerfile: game-server/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ololo-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # No .dockerbuild record artifacts — they bloat the run and the
          # release job must not try to download them.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
