[package]
name = "game-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors.workspace = true

[dependencies]
arena-core = { path = "../arena-core" }
migration = { path = "../server/migration" }
axum = { version = "0.7.5", features = ["ws", "macros"] }
tokio = { version = "1.38.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["cors", "trace", "request-id"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sea-orm = { version = "1.0.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
anyhow = "1.0.86"
futures = "0.3.30"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dashmap = "6.1.0"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
shlex = "1"
thiserror = "2.0"
async-trait = "0.1"
omq-zeromq = "0.7"
base64 = "0.22"
tempfile = "3"
which = "6"

[dev-dependencies]
tokio = { version = "1.38.0", features = ["full", "test-util"] }
tempfile = "3"
migration = { path = "../server/migration" }
sea-orm-migration = { version = "1.0.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tower = { version = "0.4.13", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[[bin]]
name = "game-server"
path = "src/main.rs"

[lib]
name = "game_server"
path = "src/lib.rs"